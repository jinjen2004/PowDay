<head>
    <link rel="stylesheet" href="{{url_for('static',filename='css/all.css')}}">
    <link rel="stylesheet" href="{{url_for('static',filename='css/search.css')}}">
</head>

<body>
    <ul>
        <li><a href="{{url_for('home')}}">Home</a></li>
        <li><a href="{{url_for('explore')}}">Explore</a></li>
        <li><a class="active" href="{{url_for('search')}}">Search</a></li>
    </ul>
    <form>
        <p>Price</p> <br>
        <input type="radio" id="$" name="price" value="$">
        <label for="$" class="radio-container">$</label>
        <input type="radio" id="$$" name="price" value="$$">
        <label for="$$" class="radio-container">$$</label>
        <input type="radio" id="$$$" name="price" value="$$$">
        <label for="$$$" class="radio-container">$$$</label>
        <br> <br>
        <p>Distance from Location</p><br>
        <input type="radio" id="lowdist" name="dist" value="lowDist">
        <label for="lowdist" class="radio-container">1-25 Miles</label>
        <input type="radio" id="meddist" name="dist" value="medDist">
        <label for="meddist" class="radio-container">50-100 Miles</label>
        <input type="radio" id="fardist" name="dist" value="farDist">
        <label for="fardist" class="radio-container">100-150 Miles</label>
        <br> <br>
        <p>Duration</p><br>
        <input type="radio" id="shortdur" name="duration" value="shortDur">
        <label for="shortdur" class="radio-container">1-4 Hours</label>
        <input type="radio" id="meddur" name="duration" value="medDur">
        <label for="meddur" class="radio-container">5-10 Hourss</label>
        <input type="radio" id="largedur" name="duration" value="largeDur">
        <label for="largedur" class="radio-container">10+ Hours</label>
        <br> <br>
        <p>Days of Week - Select Multiple if Needed</p> <br>
        <input type="checkbox" id="monday" name="days" value="Monday">
        <label for="monday">Monday</label>
        <input type="checkbox" id="tuesday" name="days" value="Tuesday">
        <label for="tuesday">Tuesday</label>
        <input type="checkbox" id="wednesday" name="days" value="Wednesday">
        <label for="wednesday">Wednesday</label>
        <input type="checkbox" id="thursday" name="days" value="Thursday">
        <label for="thursday">Thursday</label>
        <input type="checkbox" id="friday" name="days" value="Friday">
        <label for="friday">Friday</label>
        <input type="checkbox" id="saturday" name="days" value="Saturday">
        <label for="saturday">Saturday</label>
        <input type="checkbox" id="sunday" name="days" value="Sunday">
        <label for="sunday">Sunday</label>
    </form>
</body>
