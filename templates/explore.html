<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/explore.css') }}">
</head>
<body>
    <ul>
        <li><a href="{{ url_for('home') }}">Home</a></li>
        <li><a class="active" href="{{ url_for('explore') }}">Explore</a></li>
        <li><a href="{{ url_for('search') }}">Search</a></li>
    </ul>

    <div class="resort-info">
        {% for resort in resortList %}
            <h1>{{ resort.resort_name }}</h1>
            <a href="{{ url_for('resort', resort_name=resort.resort_name.replace(' ', '_')) }}">
                <button class="button">Read More</button>
            </a>
        {% endfor %}
    </div>
    <br>
</body>
